[profile.default]
src = 'src'
test = 'test'
script = 'script'
out = 'out'
libs = ['lib']
cache_path = 'cache'
solc = "0.8.36"
via_ir = false
optimizer = true
optimizer_runs = 2000
bytecode_hash = "none"

# For dependencies
remappings = [
    'forge-std/=lib/forge-std/src/',
    #'@fvm-solidity/=lib/pdp/lib/fvm-solidity/src/',
]

[lint]
exclude_lints = [
    "incorrect-shift",
]
